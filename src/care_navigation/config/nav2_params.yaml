          raytrace_max_range: 10.0
          raytrace_min_range: 0.35
          obstacle_max_range: 8.0
          obstacle_min_range: 0.35
        tof_front_left:
          topic: /tof_cloud/front_left
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 1.20
          obstacle_min_range: 0.05
          obstacle_max_range: 2.0
          raytrace_min_range: 0.05
          raytrace_max_range: 2.0
        tof_front_center:
          topic: /tof_cloud/front_center
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 1.20
          obstacle_min_range: 0.05
          obstacle_max_range: 2.0
          raytrace_min_range: 0.05
          raytrace_max_range: 2.0
        tof_front_right:
          topic: /tof_cloud/front_right
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 1.20
          obstacle_min_range: 0.05
          obstacle_max_range: 2.0
          raytrace_min_range: 0.05
          raytrace_max_range: 2.0
        ultrasonic_rear_left:
          topic: /ultrasonic_cloud/rear_left
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 1.20
          obstacle_min_range: 0.02
          obstacle_max_range: 1.5
          raytrace_min_range: 0.02
          raytrace_max_range: 1.5
        ultrasonic_rear_center:
          topic: /ultrasonic_cloud/rear_center
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 1.20
          obstacle_min_range: 0.02
          obstacle_max_range: 1.5
          raytrace_min_range: 0.02
          raytrace_max_range: 1.5
        ultrasonic_rear_right:
          topic: /ultrasonic_cloud/rear_right
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 1.20
